name: 🐛 Bug Report
description: Report an issue, discrepancy, or failing behavior in the platform.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Bug Report
        Thank you for reporting. Please provide specific details so the issue can be reproduced and resolved.

  - type: dropdown
    id: module
    attributes:
      label: Affected Domain Module
      description: Select which module the bug occurred in.
      options:
        - Common / Infrastructure
        - Catalog
        - Procurement
        - Inventory
        - Pricing
        - Cart
        - Order
        - Payment
        - Logistics
        - Communication
        - Marketing
        - AI
        - Seo
        - TaxCompliance
        - Customer
        - Admin
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Navigate to '...'
        2. Perform action '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output / Screenshots
      description: Paste relevant stack traces from `storage/logs/laravel.log` or browser console.
      render: shell

